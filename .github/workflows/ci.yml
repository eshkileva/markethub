name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: development
      LOG_LEVEL: warn
      API_HOST: 0.0.0.0
      API_PORT: 3000
      PUBLIC_API_URL: http://localhost:3000
      WEB_ORIGIN: http://localhost:5173
      DATABASE_URL: postgres://markethub:markethub@localhost:5432/markethub
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret-16chars
      COOKIE_SECRET: ci-cookie-secret-16
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: markethub
      S3_ACCESS_KEY: markethub
      S3_SECRET_KEY: markethubsecret
      S3_FORCE_PATH_STYLE: 'true'
      S3_PUBLIC_URL: http://localhost:9000/markethub
      RABBITMQ_ENABLED: 'false'
      RATE_LIMIT_ENABLED: 'false'
      VITE_API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @markethub/web exec playwright install --with-deps chromium
      - run: docker compose up -d postgres redis minio minio-init
      - name: Wait for Postgres, Redis, MinIO
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T postgres pg_isready -U markethub -d markethub &&
            docker compose exec -T redis redis-cli ping &&
            curl -sf http://localhost:9000/minio/health/live &&
            exit 0
            sleep 2
          done
          echo 'infra did not become ready'
          docker compose ps
          exit 1
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - name: Start API
        run: |
          pnpm --filter @markethub/api exec tsx src/server.ts > api.log 2>&1 &
          echo $! > api.pid
      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ready && exit 0
            sleep 2
          done
          echo 'API did not become ready'
          cat api.log
          exit 1
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
      - name: API logs on failure
        if: failure()
        run: |
          if [ -f api.log ]; then cat api.log; else echo 'API was not started'; fi
